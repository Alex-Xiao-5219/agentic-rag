name: Deploy Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      BACKEND_APP: ${{ vars.AZURE_BACKEND_CONTAINER_APP }}
      FRONTEND_APP: ${{ vars.AZURE_FRONTEND_CONTAINER_APP }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python3 -m compileall -q app ui

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ vars.AZURE_ACR_LOGIN_SERVER }}/agentic-rag-api:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ${{ vars.AZURE_ACR_LOGIN_SERVER }}/agentic-rag-frontend:${{ github.sha }}

      - name: Deploy backend Container App
        run: |
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$BACKEND_APP" \
            --image "$ACR_LOGIN_SERVER/agentic-rag-api:$IMAGE_TAG"

      - name: Deploy frontend Container App
        run: |
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FRONTEND_APP" \
            --image "$ACR_LOGIN_SERVER/agentic-rag-frontend:$IMAGE_TAG"
