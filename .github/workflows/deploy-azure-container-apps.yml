name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Azure CLI
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az acr login --name ${{ vars.ACR_NAME }}

      # Backend

      - name: Build Backend
        run: |
          docker build \
            -f Dockerfile.backend \
            -t ${{ vars.ACR_LOGIN_SERVER }}/agent-rag-backend:${{ github.sha }} .

      - name: Push Backend
        run: |
          docker push \
            ${{ vars.ACR_LOGIN_SERVER }}/agent-rag-backend:${{ github.sha }}

      - name: Deploy Backend
        run: |
          az containerapp update \
            --name ${{ vars.BACKEND_CONTAINERAPP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ vars.ACR_LOGIN_SERVER }}/agent-rag-backend:${{ github.sha }}

      # Frontend

      - name: Build Frontend
        run: |
          docker build \
            -f Dockerfile.frontend \
            -t ${{ vars.ACR_LOGIN_SERVER }}/agent-rag-frontend:${{ github.sha }} .

      - name: Push Frontend
        run: |
          docker push \
            ${{ vars.ACR_LOGIN_SERVER }}/agent-rag-frontend:${{ github.sha }}

      - name: Deploy Frontend
        run: |
          az containerapp update \
            --name ${{ vars.FRONTEND_CONTAINERAPP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ vars.ACR_LOGIN_SERVER }}/agent-rag-frontend:${{ github.sha }}